# Publishes a preview build of every commit to pkg.pr.new, so a consumer can install
# an exact commit without waiting for a release.
# Requires the pkg.pr.new GitHub App on this repository: https://github.com/apps/pkg-pr-new
name: Preview release

on:
  push:
    branches: ['**']
    tags: ['!**']
  pull_request:

# checkout only; the PR comment is posted by the pkg.pr.new app, not this token
permissions:
  contents: read
  packages: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      # pkg-pr-new runs under node and shells out to a packer.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      # The @drizzle-team scope resolves from GitHub Packages, so install needs a token.
      - run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc
      - run: bun install --frozen-lockfile

      # The same gate CI's fast job runs. The integration suite needs a live cluster and
      # is too slow to sit in front of every commit.
      - run: bun run typecheck
      - run: bun run ci:lint
      - run: bun run test
      - run: bun run test:types
      - run: bun run verify:publish

      # Run from the lockfile, never npx or bunx: the tool that uploads a build of this
      # repo should be the version this repo pinned, not whatever latest resolves to.
      # --previewVersion rewrites the version to 0.0.0-preview-<sha> so a preview can
      # never satisfy a semver range meant for the npm release of the same number.
      # continue-on-error: a pkg.pr.new outage must not fail a commit the gates above passed.
      - name: Publish preview to pkg.pr.new
        id: preview
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bun run pkg-pr-new publish --json preview.json --previewVersion --comment=update --packageManager=bun,npm ./packages/drizzle-pulse
          else
            bun run pkg-pr-new publish --json preview.json --previewVersion --comment=off --packageManager=bun,npm ./packages/drizzle-pulse
          fi

      - name: Write install commands to the job summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Preview release"
            echo
            if [ "${{ steps.preview.outcome }}" != "success" ]; then
              echo "Publishing to pkg.pr.new failed. The build and test gates above are unaffected —"
              echo "this commit is still good, there is just no preview build for it."
              echo
              echo "If this persists, check that the pkg.pr.new GitHub App is installed on this repository."
            elif [ -s preview.json ]; then
              echo "Install this commit directly:"
              echo
              echo '```sh'
              jq -r '.packages[] | "bun add \(.url)"' preview.json
              echo '```'
              echo
              # The version comes from the URL pkg-pr-new returned rather than being
              # rebuilt here: it abbreviates the commit hash itself, and guessing the
              # length would print a version that does not exist.
              echo "| Package | Version | URL |"
              echo "| --- | --- | --- |"
              jq -r '.packages[]
                     | "| `\(.name)` | `0.0.0-preview-\(.url | split("@") | last)` | \(.url) |"' preview.json
              echo
              echo "Built from \`${GITHUB_SHA}\`. A preview is not a release. Builds are removed"
              echo "once they go a month without a download, and none survive past six months,"
              echo "so pin a published version for anything that has to keep resolving."
            else
              echo "pkg.pr.new reported success but produced no metadata, so there is no install URL to show."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
